[project]
name = "comic-ocr"
version = "0.1.6"
description = "An OCR library comic and manga"
authors = [
    { name = "Wanasit T" }
]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12.1",
    "torchvision>=0.13.1",
    "opencv-python>=4.5.4.60",
    "numpy>=1.21",
    "Pillow>=9.1",
    "tqdm>=4",
    "transformers>=4.23.1",
    "textdistance>=4.2.1",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-mock>=3.10",
    "jupyter>=1.0",
    "matplotlib>=3.5",
    "labelling-notebook",
    "tensorboard>=2.10",
    "coverage>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comic_ocr"]

[tool.hatch.build.targets.sdist]
include = [
    "/comic_ocr",
    "/example/manga_annotated/xkcd_100.jpg",
    "README.md",
    "pyproject.toml",
]